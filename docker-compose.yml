services:
  backend:
    build: ./infrastructure/docker/backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      CORS_ORIGINS: http://localhost:5173
      MODEL_PATH: yolo11n.pt
      EVENT_STORAGE_PATH: /data/events
      UPLOAD_STORAGE_PATH: /data/uploads
    volumes:
      - ./storage:/data
      - ./backend:/app
  frontend:
    build: ./infrastructure/docker/frontend
    ports: ["5173:5173"]
    depends_on: [backend]
